name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fieldops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      FRONTEND_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://fieldops:ci-only-password@localhost:5432/fieldops?schema=public
      TEST_DATABASE_URL: postgresql://fieldops:ci-only-password@localhost:5432/fieldops_test?schema=public
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1
      GOOGLE_CLIENT_ID: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate ephemeral test signing key
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `JWT_ACCESS_SECRET=${randomBytes(64).toString('base64')}\n`);
          JS
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:deploy
      - run: npm run db:test:setup
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run docs:check
      - run: npm run test:compiled
