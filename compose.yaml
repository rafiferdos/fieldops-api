services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fieldops
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fieldops -d fieldops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
